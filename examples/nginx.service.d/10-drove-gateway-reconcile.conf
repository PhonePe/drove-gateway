# Drop-in for nginx.service, installed by the drove-gateway package.
#
# Applies to both NGINX (OSS) and NGINX Plus, which both run under the nginx.service unit.
#
# It notifies Drove Gateway (nixy) about NGINX (re)starts so it can reconcile all upstreams:
#   - NGINX Plus : re-adds the dynamically managed upstream servers via the NGINX Plus HTTP API,
#                  which are reset whenever NGINX restarts (unless state files are configured).
#   - NGINX OSS  : re-renders the config and reloads, keeping upstreams in sync after a restart.
#
# Manual install (if not using the package):
#   sudo install -Dm0644 10-drove-gateway-reconcile.conf \
#       /etc/systemd/system/nginx.service.d/10-drove-gateway-reconcile.conf
#   sudo systemctl daemon-reload
#
# Signals sent to the Drove Gateway process:
#   SIGUSR1 (ExecStartPre)  : an NGINX (re)start is beginning.
#   SIGUSR2 (ExecStartPost) : NGINX is up; trigger a full reconciliation.
#   SIGUSR1 (ExecReload)    : an NGINX reload is in progress.
#   SIGUSR2 (ExecReload)    : NGINX reload completed; trigger a full reconciliation.
#
# The leading '-' makes each command non-fatal, so an NGINX start is never blocked if Drove
# Gateway is not running (e.g. on first boot).
[Service]
ExecStartPre=-/bin/sh -c 'systemctl kill --signal=SIGUSR1 drove.gateway.service'
ExecStartPost=-/bin/sh -c 'systemctl kill --signal=SIGUSR2 drove.gateway.service'
ExecReload=-/bin/sh -c 'systemctl kill --signal=SIGUSR1 drove.gateway.service'
ExecReload=-/bin/sh -c 'systemctl kill --signal=SIGUSR2 drove.gateway.service'
