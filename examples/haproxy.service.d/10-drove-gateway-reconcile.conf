# Drop-in for haproxy.service, installed by the drove-gateway package.
#
# It notifies Drove Gateway (nixy) about HAProxy (re)starts so it can reconcile all backends via
# the HAProxy runtime API, re-adding the dynamically managed servers that are reset whenever
# HAProxy restarts.
#
# Manual install (if not using the package):
#   sudo install -Dm0644 10-drove-gateway-reconcile.conf \
#       /etc/systemd/system/haproxy.service.d/10-drove-gateway-reconcile.conf
#   sudo systemctl daemon-reload
#
# Order of operations:
#   Start : ExecStartPre run before ExecStart, so ordering among them is not critical.
#             1. populate the #DROVE-SERVERS blocks in haproxy.cfg from the server state file
#             2. SIGUSR1 -> Drove Gateway (a HAProxy start is beginning)
#           ExecStartPost:
#             3. SIGUSR2 -> Drove Gateway (HAProxy is up; trigger a full backend reconciliation)
#   Reload: ordering matters. systemd APPENDS drop-in ExecReload= lines after the base unit's,
#           which would run our config sync AFTER HAProxy already re-read its config. We therefore
#           reset the list with an empty "ExecReload=" and redeclare every step in order:
#             1. populate the #DROVE-SERVERS blocks from the server state file
#             2. SIGUSR1 -> Drove Gateway (a HAProxy reload is in progress)
#             3. HAProxy validates its config     (equivalent of the stock haproxy.service check)
#             4. HAProxy master reloads (kill -USR2) (equivalent of the stock haproxy.service reload)
#             5. SIGUSR2 -> Drove Gateway (reload complete; trigger a full backend reconciliation)
#
# Steps 3-4 reproduce HAProxy's own reload using only $CONFIG and $MAINPID, which the stock
# haproxy.service unit defines identically on Debian/Ubuntu and RHEL/CentOS. The config check is
# run without the master-worker/extra options ($EXTRAOPTS / $OPTIONS) since they do not affect
# "-c" validation. If your distribution's haproxy.service uses a materially different reload
# mechanism, adjust steps 3-4 to match it.
#
# When haproxy_manage_global_server_state_file is enabled, the -sync-haproxy-state-config command
# rewrites the #DROVE-SERVERS-BEGIN/#DROVE-SERVERS-END blocks in haproxy.cfg from the server state
# file before HAProxy (re)reads its config, so load-server-state-from-file can restore dynamic
# servers. It is a no-op unless that option is enabled.
#
# The leading '-' makes each drove-added command non-fatal, so a HAProxy start/reload is never
# blocked if Drove Gateway is not running (e.g. on first boot). The reproduced HAProxy reload
# commands intentionally have no '-' so an invalid config still aborts the reload before kill -USR2.
[Service]
ExecStartPre=-/usr/bin/nixy -sync-haproxy-state-config -f /etc/nixy/nixy.toml
ExecStartPre=-/bin/sh -c 'systemctl kill --signal=SIGUSR1 drove.gateway.service'
ExecStartPost=-/bin/sh -c 'systemctl kill --signal=SIGUSR2 drove.gateway.service'
ExecReload=
ExecReload=-/usr/bin/nixy -sync-haproxy-state-config -f /etc/nixy/nixy.toml
ExecReload=-/bin/sh -c 'systemctl kill --signal=SIGUSR1 drove.gateway.service'
ExecReload=/usr/sbin/haproxy -f $CONFIG -c -q
ExecReload=/bin/kill -USR2 $MAINPID
ExecReload=-/bin/sh -c 'systemctl kill --signal=SIGUSR2 drove.gateway.service'
