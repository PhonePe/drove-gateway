name: Build and Push Container

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

on:
  push:
    tags: [ '*' ]
  workflow_run:
    workflows: ["Release Bot Version Bump"]
    types:
      - completed
  workflow_dispatch:
      
jobs:

  build-and-push:
    if: |
      (github.event_name == 'push' &&
       (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') ||
        contains(github.ref_name, 'rc') || contains(github.ref_name, 'snapshot') ||
        contains(github.ref_name, 'pre'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.23'

    - name: Build
      working-directory: .
      run: |
        go -C src mod download

    - name: Build
      working-directory: .
      run: |
        go -C src build -o ../docker/nixy .


    - name: Log in to the Container registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Resolve image tags from release type
      id: image-tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        IMAGE="ghcr.io/${{ github.repository }}"
        VERSION_TAG="${IMAGE}:${RELEASE_TAG}"
        IS_PRERELEASE=false

        # Prefer GitHub Release prerelease flag when release already exists.
        if gh release view "${RELEASE_TAG}" --json isPrerelease >/dev/null 2>&1; then
          IS_PRERELEASE="$(gh release view "${RELEASE_TAG}" --json isPrerelease -q .isPrerelease)"
        elif echo "${RELEASE_TAG}" | grep -Eiq '(alpha|beta|rc|snapshot|pre)'; then
          # Fallback for tags that follow prerelease naming conventions.
          IS_PRERELEASE=true
        fi

        if [ "${IS_PRERELEASE}" = "true" ]; then
          TAGS="${VERSION_TAG}"
          BODY=$(printf '%s\n' \
            'Container Image' \
            '```bash' \
            "docker pull ${VERSION_TAG}" \
            '```')
        else
          TAGS="${VERSION_TAG},${IMAGE}:latest"
          BODY=$(printf '%s\n' \
            'Container Image' \
            '```bash' \
            "docker pull ${VERSION_TAG}" \
            "docker pull ${IMAGE}:latest" \
            '```')
        fi

        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        echo "${BODY}" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: docker
        push: true
        tags: ${{ steps.image-tags.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Update GitHub Release with container link
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        append_body: true
        body: ${{ steps.image-tags.outputs.body }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
