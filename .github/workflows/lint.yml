name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: |
          go -C src mod download
          go -C src mod verify
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: src
          args: --timeout=5m --verbose
      
      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l src | wc -l)" -gt 0 ]; then
            echo "Code formatting issues found:"
            gofmt -d src
            exit 1
          fi
          echo "Code formatting check passed"
      
      - name: Run go vet
        run: |
          go -C src vet ./...
      
      - name: Check for security issues
        # Pinned to an immutable commit SHA for supply-chain safety.
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770 # v2.26.1
        with:
          args: '-no-fail -fmt json -out ../gosec-report.json ./...'
          working-directory: src
        continue-on-error: true
      
      - name: Upload gosec report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-report
          path: gosec-report.json
        if: always()
