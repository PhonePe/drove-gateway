# Nixy listening port
address = "127.0.0.1"
port = "6000"

#port_use_tls = true
#port_tls_certfile = ""
#port_tls_keyfile = ""

# X-Proxy header, defaults to hostname
xproxy = ""

# Timeout for proxy control-plane responsiveness during restart windows (seconds).
# If unresponsive longer than this, /v1/health reports ProxyControlPlane unhealthy.
#proxy_control_plane_timeout_sec = 30

# On startup, make this many fresh-sync attempts before falling back to
# persisted datamanager state for controller-unreachable namespaces.
#startup_controller_sync_tries = 2

# Persist last successfully reconciled metadata for stale-state use during controller outages.
# In-memory snapshot is always kept; this controls optional disk persistence.
#state_persistence_enabled = true

# Directory for persisted datamanager state snapshot.
#state_persistence_dir = "/var/lib/drove-gateway"


# Nginx
#nginxplusapiaddr="127.0.0.1"
nginx_config = "./nginx-test.conf"
nginx_template = "./nginx-header.tmpl"
nginx_cmd = "nginx" # optionally "openresty" or "docker exec nginx nginx"
nginx_ignore_check = true # optionally disable nginx config test. Health check will always show OK.

#nginxplusapiaddr = "10.57.11.218:2222"
maxfailsupstream = 0
failtimeoutupstream = "1s"
slowstartupstream = "0s"
event_refresh_interval_sec = 5

#Haproxy
#HAProxy
#proxy_platform="haproxy"
#haproxysocketaddr = "/run/haproxy/admin.sock"
##haproxy_reload_disabled = false
#haproxy_config = "/etc/haproxy/haproxy.cfg"
#haproxy_template = "/etc/haproxy/haproxy.tmpl"
#haproxy_reload_cmd = "systemctl reload haproxy"
#haproxy_cmd = "haproxy"
#haproxy_ignore_check = false
#haproxy_server_name_prefix = "server"
#haproxy_server_name_host_port_delimiter = "_"
#haproxy_backend_name_separator = "_"
#haproxy_backend_include_routing_tag_suffix = true
#haproxy_add_server_attributes_string = "on-marked-down shutdown-sessions"
#^stuff like disabling h2 can be done here by adding alpn http/1.1 . Some functionality like no-check, init-addr are not supported for dynamic servers
#force shutdown-sessions to don't let sessions live for long
#haproxy_add_server_ssl_attributes_string = "ssl verify required ca-file ca-certificates.crt" #defaults to ssl verify none

# Global server state file management (mainly useful with haproxy_reload_disabled = true).
# When enabled, drove-gateway writes HAProxy's "show servers state" output to the state file after
# every successful reconcile, and (via `nixy -sync-haproxy-state-config`, wired into the proxy's
# systemd ExecStartPre/ExecReload) pre-populates #DROVE-SERVERS-BEGIN/#DROVE-SERVERS-END blocks in
# haproxy.cfg so load-server-state-from-file can restore dynamically added servers.
#haproxy_manage_global_server_state_file = false
#haproxy_global_server_state_file_path = "/var/lib/haproxy/server_state"


# Drove API
[[namespaces]]
name = "stage1"
drove = ["https://localhost:8080"] # add all HA cluster nodes in priority order.
user = "" # leave empty if no auth is required.
pass = ""
leader_vhost = "drove.ssdev.stage1"
# Nixy realm, set this if you want to be able to filter your apps (e.g. when you have different loadbalancers which should expose different apps)
# Put your subdomain here. It will be used to match the subdomain of the exposed apps
realm = "blah1.xxx.stage1"

[[namespaces]]
name = "stage2"
drove = ["https://localhost:8080"] # add all HA cluster nodes in priority order.
user = "" # leave empty if no auth is required.
pass = ""
leader_vhost = "drove.ssdev.stage2"
# Nixy realm, set this if you want to be able to filter your apps (e.g. when you have different loadbalancers which should expose different apps)
# Put your subdomain here. It will be used to match the subdomain of the exposed apps
realm = "blah2.xxx.stage2"
